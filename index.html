<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de Caixa de Entrada - Chatwoot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        const { AlertCircle, Send, Check } = lucide;

        function InboxForm() {
          const [formData, setFormData] = useState({
            nomeInbox: '',
            tipoCaixa: '',
            tokenId: '',
            secretToken: '',
            clientToken: '',
            botToken: '',
            email: '',
            senha: '',
            smtpHost: '',
            smtpPort: '',
            imapHost: '',
            imapPort: '',
            apiUrl: '',
            websiteUrl: '',
            websiteName: '',
            widgetColor: '#270949'
          });

          const [errors, setErrors] = useState({});
          const [submitted, setSubmitted] = useState(false);
          const [sending, setSending] = useState(false);

          const tiposCaixa = [
            { value: '', label: 'Selecione o tipo de caixa' },
            { value: 'zapi', label: 'Z-API (WhatsApp)' },
            { value: 'telegram', label: 'Telegram' },
            { value: 'email', label: 'Email (SMTP/IMAP)' },
            { value: 'api', label: 'API Externa' },
            { value: 'website', label: 'Bot do Site' }
          ];

          const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
          };

          const handleSubmit = async () => {
            const newErrors = {};
            
            if (!formData.nomeInbox.trim()) {
              newErrors.nomeInbox = 'Nome da caixa é obrigatório';
            }
            
            if (!formData.tipoCaixa) {
              newErrors.tipoCaixa = 'Selecione um tipo de caixa';
            }
            
            if (formData.tipoCaixa === 'zapi') {
              if (!formData.tokenId) newErrors.tokenId = 'Token ID é obrigatório';
              if (!formData.secretToken) newErrors.secretToken = 'Secret Token é obrigatório';
              if (!formData.clientToken) newErrors.clientToken = 'Client Token é obrigatório';
            }
            
            if (formData.tipoCaixa === 'telegram') {
              if (!formData.botToken) newErrors.botToken = 'Bot Token é obrigatório';
            }
            
            if (formData.tipoCaixa === 'email') {
              if (!formData.email) newErrors.email = 'Email é obrigatório';
              if (!formData.senha) newErrors.senha = 'Senha é obrigatória';
              if (!formData.smtpHost) newErrors.smtpHost = 'SMTP Host é obrigatório';
              if (!formData.smtpPort) newErrors.smtpPort = 'SMTP Port é obrigatório';
              if (!formData.imapHost) newErrors.imapHost = 'IMAP Host é obrigatório';
              if (!formData.imapPort) newErrors.imapPort = 'IMAP Port é obrigatório';
            }
            
            if (formData.tipoCaixa === 'api') {
              if (!formData.apiUrl) newErrors.apiUrl = 'URL da API é obrigatória';
            }
            
            if (formData.tipoCaixa === 'website') {
              if (!formData.websiteUrl) newErrors.websiteUrl = 'URL do site é obrigatória';
              if (!formData.websiteName) newErrors.websiteName = 'Nome do site é obrigatório';
            }
            
            setErrors(newErrors);
            
            if (Object.keys(newErrors).length === 0) {
              setSending(true);
              
              try {
                const response = await fetch('https://n8n.upperfy.com.br/webhook/fa9b6149-f358-4a2d-a125-722d58bb29af', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    ...formData,
                    dataEnvio: new Date().toISOString()
                  })
                });
                
                if (response.ok) {
                  setSubmitted(true);
                } else {
                  alert('Erro ao enviar os dados. Por favor, tente novamente.');
                }
              } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao enviar os dados. Por favor, verifique sua conexão e tente novamente.');
              } finally {
                setSending(false);
              }
            }
          };

          return (
            <div className="min-h-screen p-6" style={{ backgroundColor: '#f5f5f5', fontFamily: 'Montserrat, sans-serif' }}>
              <div className="max-w-3xl mx-auto">
                <div className="rounded-lg shadow-lg p-8" style={{ backgroundColor: 'white' }}>
                  {!submitted ? (
                    <>
                      <div className="mb-8 text-center">
                        <h1 className="text-3xl font-bold mb-2" style={{ color: '#270949' }}>
                          Criação de Caixa de Entrada
                        </h1>
                        <p className="text-gray-600">
                          Preencha os dados abaixo para solicitar a criação da sua caixa
                        </p>
                      </div>

                      <div className="space-y-6">
                        <div>
                          <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>
                            Nome da Caixa de Entrada *
                          </label>
                          <input
                            type="text"
                            name="nomeInbox"
                            value={formData.nomeInbox}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 transition"
                            style={{ borderColor: errors.nomeInbox ? '#F93D00' : '#e0e0e0' }}
                            placeholder="Ex: Atendimento WhatsApp"
                          />
                          {errors.nomeInbox && (
                            <p className="mt-1 text-sm flex items-center gap-1" style={{ color: '#F93D00' }}>
                              <AlertCircle size={16} /> {errors.nomeInbox}
                            </p>
                          )}
                        </div>

                        <div>
                          <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>
                            Selecione o Tipo de Caixa *
                          </label>
                          <select
                            name="tipoCaixa"
                            value={formData.tipoCaixa}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 transition"
                            style={{ borderColor: errors.tipoCaixa ? '#F93D00' : '#e0e0e0', color: '#270949' }}
                          >
                            {tiposCaixa.map(tipo => (
                              <option key={tipo.value} value={tipo.value}>{tipo.label}</option>
                            ))}
                          </select>
                          {errors.tipoCaixa && (
                            <p className="mt-1 text-sm flex items-center gap-1" style={{ color: '#F93D00' }}>
                              <AlertCircle size={16} /> {errors.tipoCaixa}
                            </p>
                          )}
                        </div>

                        {formData.tipoCaixa === 'zapi' && (
                          <div className="p-6 rounded-lg space-y-4" style={{ backgroundColor: '#f8f9fa', border: '2px solid #270949' }}>
                            <h3 className="font-bold text-lg mb-4" style={{ color: '#270949' }}>
                              Credenciais Z-API
                            </h3>
                            
                            <div className="mb-4 p-3 rounded" style={{ backgroundColor: '#fff3cd', color: '#856404' }}>
                              <p className="text-sm">
                                📌 <strong>Onde obter suas credenciais:</strong>
                                <br />
                                Acesse <a href="https://developer.z-api.io/credentials" target="_blank" rel="noopener noreferrer" className="underline font-semibold">https://developer.z-api.io/credentials</a> para obter seu Token ID, Secret Token e Client Token
                              </p>
                            </div>

                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Token ID *</label>
                              <input
                                type="text"
                                name="tokenId"
                                value={formData.tokenId}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.tokenId ? '#F93D00' : '#e0e0e0' }}
                                placeholder="Ex: 5F8C9B2A..."
                              />
                              {errors.tokenId && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.tokenId}</p>}
                            </div>

                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Secret Token *</label>
                              <input
                                type="password"
                                name="secretToken"
                                value={formData.secretToken}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.secretToken ? '#F93D00' : '#e0e0e0' }}
                                placeholder="••••••••"
                              />
                              {errors.secretToken && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.secretToken}</p>}
                            </div>

                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Client Token *</label>
                              <input
                                type="password"
                                name="clientToken"
                                value={formData.clientToken}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.clientToken ? '#F93D00' : '#e0e0e0' }}
                                placeholder="••••••••"
                              />
                              {errors.clientToken && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.clientToken}</p>}
                            </div>
                          </div>
                        )}

                        {formData.tipoCaixa === 'telegram' && (
                          <div className="p-6 rounded-lg space-y-4" style={{ backgroundColor: '#f8f9fa', border: '2px solid #270949' }}>
                            <h3 className="font-bold text-lg mb-4" style={{ color: '#270949' }}>
                              Configuração Telegram
                            </h3>
                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Bot Token *</label>
                              <input
                                type="text"
                                name="botToken"
                                value={formData.botToken}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.botToken ? '#F93D00' : '#e0e0e0' }}
                                placeholder="Ex: 123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
                              />
                              {errors.botToken && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.botToken}</p>}
                              <p className="mt-2 text-sm text-gray-600">
                                💡 Obtenha seu token conversando com @BotFather no Telegram
                              </p>
                            </div>
                          </div>
                        )}

                        {formData.tipoCaixa === 'email' && (
                          <div className="p-6 rounded-lg space-y-4" style={{ backgroundColor: '#f8f9fa', border: '2px solid #270949' }}>
                            <h3 className="font-bold text-lg mb-4" style={{ color: '#270949' }}>
                              Configuração de Email (SMTP/IMAP)
                            </h3>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              <div className="md:col-span-2">
                                <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Email *</label>
                                <input
                                  type="email"
                                  name="email"
                                  value={formData.email}
                                  onChange={handleChange}
                                  className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                  style={{ borderColor: errors.email ? '#F93D00' : '#e0e0e0' }}
                                  placeholder="suporte@exemplo.com"
                                />
                                {errors.email && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.email}</p>}
                              </div>

                              <div className="md:col-span-2">
                                <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Senha *</label>
                                <input
                                  type="password"
                                  name="senha"
                                  value={formData.senha}
                                  onChange={handleChange}
                                  className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                  style={{ borderColor: errors.senha ? '#F93D00' : '#e0e0e0' }}
                                  placeholder="••••••••"
                                />
                                {errors.senha && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.senha}</p>}
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>SMTP Host *</label>
                                <input
                                  type="text"
                                  name="smtpHost"
                                  value={formData.smtpHost}
                                  onChange={handleChange}
                                  className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                  style={{ borderColor: errors.smtpHost ? '#F93D00' : '#e0e0e0' }}
                                  placeholder="smtp.exemplo.com"
                                />
                                {errors.smtpHost && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.smtpHost}</p>}
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>SMTP Port *</label>
                                <input
                                  type="text"
                                  name="smtpPort"
                                  value={formData.smtpPort}
                                  onChange={handleChange}
                                  className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                  style={{ borderColor: errors.smtpPort ? '#F93D00' : '#e0e0e0' }}
                                  placeholder="587 ou 465"
                                />
                                {errors.smtpPort && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.smtpPort}</p>}
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>IMAP Host *</label>
                                <input
                                  type="text"
                                  name="imapHost"
                                  value={formData.imapHost}
                                  onChange={handleChange}
                                  className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                  style={{ borderColor: errors.imapHost ? '#F93D00' : '#e0e0e0' }}
                                  placeholder="imap.exemplo.com"
                                />
                                {errors.imapHost && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.imapHost}</p>}
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>IMAP Port *</label>
                                <input
                                  type="text"
                                  name="imapPort"
                                  value={formData.imapPort}
                                  onChange={handleChange}
                                  className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                  style={{ borderColor: errors.imapPort ? '#F93D00' : '#e0e0e0' }}
                                  placeholder="993 ou 143"
                                />
                                {errors.imapPort && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.imapPort}</p>}
                              </div>
                            </div>
                          </div>
                        )}

                        {formData.tipoCaixa === 'api' && (
                          <div className="p-6 rounded-lg space-y-4" style={{ backgroundColor: '#f8f9fa', border: '2px solid #270949' }}>
                            <h3 className="font-bold text-lg mb-4" style={{ color: '#270949' }}>
                              API Externa
                            </h3>
                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>URL da API *</label>
                              <input
                                type="url"
                                name="apiUrl"
                                value={formData.apiUrl}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.apiUrl ? '#F93D00' : '#e0e0e0' }}
                                placeholder="https://api.exemplo.com/webhook"
                              />
                              {errors.apiUrl && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.apiUrl}</p>}
                            </div>
                          </div>
                        )}

                        {formData.tipoCaixa === 'website' && (
                          <div className="p-6 rounded-lg space-y-4" style={{ backgroundColor: '#f8f9fa', border: '2px solid #270949' }}>
                            <h3 className="font-bold text-lg mb-4" style={{ color: '#270949' }}>
                              Configuração do Bot do Site
                            </h3>
                            
                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>URL do Site *</label>
                              <input
                                type="url"
                                name="websiteUrl"
                                value={formData.websiteUrl}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.websiteUrl ? '#F93D00' : '#e0e0e0' }}
                                placeholder="https://seusite.com.br"
                              />
                              {errors.websiteUrl && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.websiteUrl}</p>}
                            </div>

                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Nome do Site *</label>
                              <input
                                type="text"
                                name="websiteName"
                                value={formData.websiteName}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2"
                                style={{ borderColor: errors.websiteName ? '#F93D00' : '#e0e0e0' }}
                                placeholder="Minha Empresa"
                              />
                              {errors.websiteName && <p className="mt-1 text-sm" style={{ color: '#F93D00' }}>{errors.websiteName}</p>}
                            </div>

                            <div>
                              <label className="block text-sm font-semibold mb-2" style={{ color: '#270949' }}>Cor do Widget</label>
                              <div className="flex gap-3 items-center">
                                <input
                                  type="color"
                                  name="widgetColor"
                                  value={formData.widgetColor}
                                  onChange={handleChange}
                                  className="h-12 w-20 rounded cursor-pointer"
                                />
                                <input
                                  type="text"
                                  value={formData.widgetColor}
                                  onChange={(e) => setFormData(prev => ({ ...prev, widgetColor: e.target.value }))}
                                  className="flex-1 px-4 py-3 border rounded-lg"
                                  placeholder="#270949"
                                />
                              </div>
                            </div>

                            <div className="mt-4 p-3 rounded" style={{ backgroundColor: '#d1ecf1', color: '#0c5460' }}>
                              <p className="text-sm">
                                ℹ️ O link embedável será gerado pela nossa equipe após a criação da caixa no Chatwoot
                              </p>
                            </div>
                          </div>
                        )}

                        <button
                          onClick={handleSubmit}
                          disabled={sending}
                          className="w-full py-4 rounded-lg font-bold text-white text-lg flex items-center justify-center gap-2 transition-all hover:opacity-90 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                          style={{ backgroundColor: '#F93D00' }}
                        >
                          <Send size={20} />
                          {sending ? 'Enviando...' : 'Enviar Solicitação'}
                        </button>

                        <p className="text-sm text-center text-gray-600">
                          * Campos obrigatórios. Nossa equipe de suporte criará a caixa e entrará em contato.
                        </p>
                      </div>
                    </>
                  ) : (
                    <div className="text-center py-12">
                      <div className="mb-6 flex justify-center">
                        <div className="rounded-full p-6" style={{ backgroundColor: '#d4edda' }}>
                          <Check size={64} style={{ color: '#155724' }} />
                        </div>
                      </div>
                      
                      <h2 className="text-3xl font-bold mb-4" style={{ color: '#270949' }}>
                        Solicitação Enviada com Sucesso!
                      </h2>
                      
                      <div className="max-w-2xl mx-auto space-y-4 text-left">
                        <div className="p-6 rounded-lg" style={{ backgroundColor: '#f8f9fa', border: '2px solid #270949' }}>
                          <h3 className="font-bold text-lg mb-3" style={{ color: '#270949' }}>
                            ✓ Próximos Passos
                          </h3>
                          <ul className="space-y-3 text-gray-700">
                            <li className="flex items-start gap-2">
                              <span className="font-bold" style={{ color: '#F93D00' }}>1.</span>
                              <span>Sua solicitação de criação de caixa de entrada está <strong>sob análise</strong> pela nossa equipe técnica.</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold" style={{ color: '#F93D00' }}>2.</span>
                              <span>Os <strong>administradores da conta</strong> receberão um contato da nossa equipe com as instruções detalhadas.</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold" style={{ color: '#F93D00' }}>3.</span>
                              <span>Você receberá orientações sobre como <strong>adicionar agentes e atendentes</strong> à nova caixa de entrada.</span>
                            </li>
                          </ul>
                        </div>
                        
                        <div className="p-4 rounded-lg" style={{ backgroundColor: '#fff3cd', border: '1px solid #856404' }}>
                          <p className="text-sm" style={{ color: '#856404' }}>
                            <strong>⏱️ Tempo de análise:</strong> Normalmente processamos as solicitações em até 24 horas úteis.
                          </p>
                        </div>
                      </div>
                      
                      <div className="mt-8">
                        <p className="text-gray-600 mb-6">
                          Enquanto isso, se precisar de ajuda ou tiver alguma dúvida, entre em contato com nosso suporte.
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<InboxForm />, document.getElementById('root'));
    </script>
</body>
</html>
